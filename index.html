<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🚗 峰｜跑車記帳</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}

main{
  max-width:600px;
  margin:auto;
  padding:18px;
}

h1{
  margin:5px 0;
}

.sub{
  color:#777;
  font-size:13px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 10px #0001;
}

.row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.row input{
  flex:1;
}

input,
button{
  font-size:16px;
  padding:12px;
  border-radius:10px;
}

input{
  width:100%;
  border:1px solid #ddd;
  background:white;
}

button{
  border:0;
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.box{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
}

.label{
  font-size:12px;
  color:#777;
}

.num{
  font-size:20px;
  font-weight:bold;
  margin-top:5px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.small{
  color:#777;
  font-size:13px;
}

.del{
  background:#fff0f0;
  color:#c00;
  padding:7px 10px;
  font-size:13px;
}
</style>
</head>

<body>

<main>

<h1>🚗 峰｜跑車記帳</h1>

<div class="sub">
每天輸入每趟金額即可，資料會保存，不會每天歸零。
</div>

<!-- 今日 -->
<div class="card">

<h3>📅 今天</h3>

<input id="dateInput" type="date">

<div class="summary">

<div class="box">
<div class="label">今日收入</div>
<div class="num" id="todayIncome">$0</div>
</div>

<div class="box">
<div class="label">今日支出</div>
<div class="num" id="todayExpense">$0</div>
</div>

<div class="box">
<div class="label">今日淨額</div>
<div class="num" id="todayNet">$0</div>
</div>

<div class="box">
<div class="label">今日趟數</div>
<div class="num" id="todayTrips">0 趟</div>
</div>

</div>
</div>


<!-- 跑車收入 -->
<div class="card">

<h3>🚗 新增一趟</h3>

<div class="row">

<input
id="tripInput"
type="number"
inputmode="numeric"
placeholder="這趟多少錢">

<button id="tripButton">
加入
</button>

</div>

<div id="tripList"></div>

</div>


<!-- 加油 -->
<div class="card">

<h3>⛽ 加油</h3>

<div class="row">

<input
id="gasInput"
type="number"
inputmode="numeric"
placeholder="加油多少錢">

<button id="gasButton">
加入
</button>

</div>

<div id="gasList"></div>

</div>


<!-- 系統費 -->
<div class="card">

<h3>💳 系統費</h3>

<div class="row">

<input
id="systemInput"
type="number"
inputmode="numeric"
placeholder="系統費多少錢">

<button id="systemButton">
加入
</button>

</div>

<div id="systemList"></div>

</div>


<!-- 儲值費 -->
<div class="card">

<h3>💰 儲值費</h3>

<div class="row">

<input
id="topupInput"
type="number"
inputmode="numeric"
placeholder="儲值多少錢">

<button id="topupButton">
加入
</button>

</div>

<div id="topupList"></div>

</div>


<!-- 累計 -->
<div class="card">

<h3>📊 累計</h3>

<div class="summary">

<div class="box">
<div class="label">累計收入</div>
<div class="num" id="totalIncome">$0</div>
</div>

<div class="box">
<div class="label">累計加油</div>
<div class="num" id="totalGas">$0</div>
</div>

<div class="box">
<div class="label">累計系統費</div>
<div class="num" id="totalSystem">$0</div>
</div>

<div class="box">
<div class="label">累計儲值費</div>
<div class="num" id="totalTopup">$0</div>
</div>

<div class="box">
<div class="label">累計總支出</div>
<div class="num" id="totalExpense">$0</div>
</div>

<div class="box">
<div class="label">累計淨額</div>
<div class="num" id="totalNet">$0</div>
</div>

</div>
</div>


<!-- 每日紀錄 -->
<div class="card">

<h3>📅 每日紀錄</h3>

<div id="historyList"></div>

</div>


<!-- 補登 -->
<div class="card">

<h3>📝 補登以前的總額</h3>

<div class="small">
前幾天如果只知道總金額，可以直接補登。
</div>

<br>

<input id="oldDate" type="date">

<br><br>

<input
id="oldIncome"
type="number"
inputmode="numeric"
placeholder="收入總額">

<br><br>

<input
id="oldGas"
type="number"
inputmode="numeric"
placeholder="加油總額">

<br><br>

<input
id="oldSystem"
type="number"
inputmode="numeric"
placeholder="系統費總額">

<br><br>

<input
id="oldTopup"
type="number"
inputmode="numeric"
placeholder="儲值費總額">

<br><br>

<button
id="oldSaveButton"
style="width:100%;">

儲存這一天

</button>

</div>

</main>


<script>

/* =========================
   資料儲存
========================= */

const STORAGE_KEY = "rideTrackerV3";

let data = {};


/* =========================
   讀取資料
========================= */

function loadData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      data = JSON.parse(saved);

    }else{

      data = {};

    }

  }catch(error){

    console.log(error);

    data = {};

  }

}


/* =========================
   今天日期
========================= */

function getToday(){

  const now = new Date();

  const local =
    new Date(
      now.getTime()
      -
      now.getTimezoneOffset()*60000
    );

  return local
    .toISOString()
    .slice(0,10);

}


/* =========================
   每一天的資料
========================= */

function getDay(date){

  if(!data[date]){

    data[date] = {};

  }

  if(!Array.isArray(data[date].trips)){

    data[date].trips = [];

  }

  if(!Array.isArray(data[date].gas)){

    data[date].gas = [];

  }

  if(!Array.isArray(data[date].system)){

    data[date].system = [];

  }

  if(!Array.isArray(data[date].topup)){

    data[date].topup = [];

  }

  return data[date];

}


/* =========================
   儲存
========================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    alert(
      "資料無法儲存，請確認你不是使用 Safari 私密瀏覽。"
    );

    return;

  }

  render();

}


/* =========================
   加總
========================= */

function sum(list){

  return (list || [])
    .reduce(
      function(total,value){

        return total +
          Number(value || 0);

      },
      0
    );

}


/* =========================
   金額格式
========================= */

function money(value){

  return "$" +
    Math.round(
      Number(value || 0)
    ).toLocaleString("zh-TW");

}


/* =========================
   新增資料
========================= */

function addRecord(type,inputId){

  const date =
    document.getElementById(
      "dateInput"
    ).value;

  const input =
    document.getElementById(
      inputId
    );

  const value =
    Number(input.value);

  if(value <= 0){

    alert("請輸入金額");

    return;

  }

  getDay(date)[type].push(value);

  input.value = "";

  saveData();

}


/* =========================
   刪除收入
========================= */

function deleteTrip(
  date,
  index
){

  getDay(date)
    .trips
    .splice(index,1);

  saveData();

}


/* =========================
   刪除支出
========================= */

function deleteExpense(
  type,
  date,
  index
){

  getDay(date)[type]
    .splice(index,1);

  saveData();

}


/* =========================
   顯示收入
========================= */

function renderTrips(
  date,
  day
){

  const box =
    document.getElementById(
      "tripList"
    );

  if(day.trips.length === 0){

    box.innerHTML =
      '<p class="small">今天還沒有收入</p>';

    return;

  }

  box.innerHTML =
    day.trips
      .map(
        function(value,index){

          return `
          <div class="item">

            <span>
              第${index+1}趟　
              ${money(value)}
            </span>

            <button
              class="del"
              onclick="
                deleteTrip(
                  '${date}',
                  ${index}
                )
              "
            >
              刪除
            </button>

          </div>
          `;

        }
      )
      .join("");

}


/* =========================
   顯示支出
========================= */

function renderExpense(
  elementId,
  type,
  date,
  list,
  label
){

  const box =
    document.getElementById(
      elementId
    );

  if(list.length === 0){

    box.innerHTML =
      `<p class="small">
        今天還沒有${label}
      </p>`;

    return;

  }

  box.innerHTML =
    list
      .map(
        function(value,index){

          return `
          <div class="item">

            <span>
              第${index+1}次　
              ${money(value)}
            </span>

            <button
              class="del"
              onclick="
                deleteExpense(
                  '${type}',
                  '${date}',
                  ${index}
                )
              "
            >
              刪除
            </button>

          </div>
          `;

        }
      )
      .join("");

}


/* =========================
   補登以前的資料
========================= */

function saveOldDay(){

  const date =
    document.getElementById(
      "oldDate"
    ).value;

  if(!date){

    alert("請選擇日期");

    return;

  }

  const income =
    Number(
      document.getElementById(
        "oldIncome"
      ).value
    ) || 0;

  const gas =
    Number(
      document.getElementById(
        "oldGas"
      ).value
    ) || 0;

  const system =
    Number(
      document.getElementById(
        "oldSystem"
      ).value
    ) || 0;

  const topup =
    Number(
      document.getElementById(
        "oldTopup"
      ).value
    ) || 0;


  data[date] = {

    trips:
      income > 0
      ? [income]
      : [],

    gas:
      gas > 0
      ? [gas]
      : [],

    system:
      system > 0
      ? [system]
      : [],

    topup:
      topup > 0
      ? [topup]
      : [],

    old:true

  };


  document.getElementById(
    "oldIncome"
  ).value = "";

  document.getElementById(
    "oldGas"
  ).value = "";

  document.getElementById(
    "oldSystem"
  ).value = "";

  document.getElementById(
    "oldTopup"
  ).value = "";


  saveData();

}


/* =========================
   畫面更新
========================= */

function render(){

  const date =
    document.getElementById(
      "dateInput"
    ).value;

  const day =
    getDay(date);


  const income =
    sum(day.trips);

  const gas =
    sum(day.gas);

  const system =
    sum(day.system);

  const topup =
    sum(day.topup);

  const expense =
    gas +
    system +
    topup;

  const net =
    income -
    expense;


  /* 今日 */

  document.getElementById(
    "todayIncome"
  ).textContent =
    money(income);

  document.getElementById(
    "todayExpense"
  ).textContent =
    money(expense);

  document.getElementById(
    "todayNet"
  ).textContent =
    money(net);

  document.getElementById(
    "todayTrips"
  ).textContent =
    day.trips.length +
    " 趟";


  /* 明細 */

  renderTrips(
    date,
    day
  );

  renderExpense(
    "gasList",
    "gas",
    date,
    day.gas,
    "加油"
  );

  renderExpense(
    "systemList",
    "system",
    date,
    day.system,
    "系統費"
  );

  renderExpense(
    "topupList",
    "topup",
    date,
    day.topup,
    "儲值費"
  );


  /* 累計 */

  let totalIncome = 0;
  let totalGas = 0;
  let totalSystem = 0;
  let totalTopup = 0;


  Object.values(data)
    .forEach(
      function(day){

        totalIncome +=
          sum(day.trips);

        totalGas +=
          sum(day.gas);

        totalSystem +=
          sum(day.system);

        totalTopup +=
          sum(day.topup);

      }
    );


  const totalExpense =
    totalGas +
    totalSystem +
    totalTopup;

  const totalNet =
    totalIncome -
    totalExpense;


  document.getElementById(
    "totalIncome"
  ).textContent =
    money(totalIncome);

  document.getElementById(
    "totalGas"
  ).textContent =
    money(totalGas);

  document.getElementById(
    "totalSystem"
  ).textContent =
    money(totalSystem);

  document.getElementById(
    "totalTopup"
  ).textContent =
    money(totalTopup);

  document.getElementById(
    "totalExpense"
  ).textContent =
    money(totalExpense);

  document.getElementById(
    "totalNet"
  ).textContent =
    money(totalNet);


  /* 每日紀錄 */

  const history =
    document.getElementById(
      "historyList"
    );

  const dates =
    Object.keys(data)
      .sort()
      .reverse();


  if(dates.length === 0){

    history.innerHTML =
      '<p class="small">還沒有紀錄</p>';

    return;

  }


  history.innerHTML =
    dates
      .map(
        function(date){

          const day =
            getDay(date);

          const income =
            sum(day.trips);

          const gas =
            sum(day.gas);

          const system =
            sum(day.system);

          const topup =
            sum(day.topup);

          const expense =
            gas +
            system +
            topup;

          const net =
            income -
            expense;


          return `
          <div class="item">

            <span>

              <b>${date}</b>

              <br>

              <small>

                收入 ${money(income)}

                <br>

                加油 ${money(gas)}

                ｜ 系統費 ${money(system)}

                ｜ 儲值費 ${money(topup)}

              </small>

            </span>

            <b>
              ${money(net)}
            </b>

          </div>
          `;

        }
      )
      .join("");

}


/* =========================
   綁定按鈕
========================= */

document
  .getElementById(
    "tripButton"
  )
  .onclick =
    function(){

      addRecord(
        "trips",
        "tripInput"
      );

    };


document
  .getElementById(
    "gasButton"
  )
  .onclick =
    function(){

      addRecord(
        "gas",
        "gasInput"
      );

    };


document
  .getElementById(
    "systemButton"
  )
  .onclick =
    function(){

      addRecord(
        "system",
        "systemInput"
      );

    };


document
  .getElementById(
    "topupButton"
  )
  .onclick =
    function(){

      addRecord(
        "topup",
        "topupInput"
      );

    };


document
  .getElementById(
    "oldSaveButton"
  ).onclick =
    saveOldDay;


document
  .getElementById(
    "dateInput"
  ).onchange =
    render;


/* =========================
   啟動
========================= */

loadData();

document.getElementById(
  "dateInput"
).value =
  getToday();

document.getElementById(
  "oldDate"
).value =
  getToday();

render();

</script>

</body>
</html>
