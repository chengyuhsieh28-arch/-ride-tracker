<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🚗 跑車記帳</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}

main{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 10px #0001;
}

h1{margin:5px 0}

.sub{
  color:#777;
  font-size:13px;
}

input,button{
  font-size:16px;
  padding:12px;
  border-radius:10px;
}

input{
  border:1px solid #ddd;
  width:100%;
  background:white;
}

button{
  border:0;
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.row input{
  flex:1;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.box{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
}

.label{
  font-size:12px;
  color:#777;
}

.num{
  font-size:20px;
  font-weight:bold;
  margin-top:5px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.del{
  background:#fff0f0;
  color:#c00;
  padding:7px;
  font-size:13px;
}

.small{
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<main>

<h1>🚗 跑車記帳</h1>

<div class="sub">
收入、加油、系統費、儲值費都會保留，不會每天歸零。
</div>


<!-- 今日 -->

<div class="card">

<input id="dateInput" type="date">

<div class="summary" style="margin-top:12px">

<div class="box">
<div class="label">今日收入</div>
<div class="num" id="todayIncome">$0</div>
</div>

<div class="box">
<div class="label">今日總支出</div>
<div class="num" id="todayExpense">$0</div>
</div>

<div class="box">
<div class="label">今日淨額</div>
<div class="num" id="todayNet">$0</div>
</div>

<div class="box">
<div class="label">今日趟數</div>
<div class="num" id="todayTrips">0 趟</div>
</div>

</div>
</div>


<!-- 收入 -->

<div class="card">

<h3>🚗 新增一趟</h3>

<div class="row">

<input
id="tripInput"
type="number"
inputmode="numeric"
placeholder="這趟多少錢">

<button id="tripButton">
加入
</button>

</div>

<div id="tripList"></div>

</div>


<!-- 加油 -->

<div class="card">

<h3>⛽ 加油</h3>

<div class="row">

<input
id="gasInput"
type="number"
inputmode="numeric"
placeholder="加油多少錢">

<button id="gasButton">
加入
</button>

</div>

<div id="gasList"></div>

</div>


<!-- 系統費 -->

<div class="card">

<h3>💳 系統費</h3>

<div class="row">

<input
id="systemInput"
type="number"
inputmode="numeric"
placeholder="系統費多少錢">

<button id="systemButton">
加入
</button>

</div>

<div id="systemList"></div>

</div>


<!-- 儲值費 -->

<div class="card">

<h3>💰 儲值費</h3>

<div class="row">

<input
id="topupInput"
type="number"
inputmode="numeric"
placeholder="儲值多少錢">

<button id="topupButton">
加入
</button>

</div>

<div id="topupList"></div>

</div>


<!-- 累計 -->

<div class="card">

<h3>📊 累計</h3>

<div class="summary">

<div class="box">
<div class="label">累計收入</div>
<div class="num" id="totalIncome">$0</div>
</div>

<div class="box">
<div class="label">累計加油</div>
<div class="num" id="totalGas">$0</div>
</div>

<div class="box">
<div class="label">累計系統費</div>
<div class="num" id="totalSystem">$0</div>
</div>

<div class="box">
<div class="label">累計儲值費</div>
<div class="num" id="totalTopup">$0</div>
</div>

<div class="box">
<div class="label">累計總支出</div>
<div class="num" id="totalExpense">$0</div>
</div>

<div class="box">
<div class="label">累計淨額</div>
<div class="num" id="totalNet">$0</div>
</div>

</div>
</div>


<!-- 每日紀錄 -->

<div class="card">

<h3>📅 每日紀錄</h3>

<div id="historyList"></div>

</div>


<!-- 補登 -->

<div class="card">

<h3>📝 補登以前的總額</h3>

<div class="small">
前幾天如果只知道總額，可以直接補登。
</div>

<br>

<input id="oldDate" type="date">

<br><br>

<input
id="oldIncome"
type="number"
inputmode="numeric"
placeholder="收入總額">

<br><br>

<input
id="oldGas"
type="number"
inputmode="numeric"
placeholder="加油總額">

<br><br>

<input
id="oldSystem"
type="number"
inputmode="numeric"
placeholder="系統費總額">

<br><br>

<input
id="oldTopup"
type="number"
inputmode="numeric"
placeholder="儲值費總額">

<br><br>

<button
id="oldSaveButton"
style="width:100%">
儲存這一天
</button>

</div>

</main>


<script>

const STORAGE_KEY = "rideTrackerV3";

let data = {};

try{
  data = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "{}"
  );
}catch(e){
  data = {};
}


/* 今天 */

function getToday(){

  const d = new Date();

  const local = new Date(
    d.getTime() - d.getTimezoneOffset()*60000
  );

  return local.toISOString().slice(0,10);

}


/* 確保每天都有完整資料 */

function getDay(date){

  if(!data[date]){
    data[date] = {};
  }

  if(!Array.isArray(data[date].trips)){
    data[date].trips = [];
  }

  if(!Array.isArray(data[date].gas)){
    data[date].gas = [];
  }

  if(!Array.isArray(data[date].system)){
    data[date].system = [];
  }

  if(!Array.isArray(data[date].topup)){
    data[date].topup = [];
  }

  return data[date];

}


/* 儲存 */

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  render();

}


/* 加總 */

function total(list){

  return (list || []).reduce(
    function(sum,value){
      return sum + Number(value || 0);
    },
    0
  );

}


/* 金額 */

function money(value){

  return "$" +
    Math.round(Number(value || 0))
    .toLocaleString("zh-TW");

}


/* 新增一趟 */

function addTrip(){

  const date =
    document.getElementById("dateInput").value;

  const input =
    document.getElementById("tripInput");

  const value =
    Number(input.value);

  if(value <= 0){
    alert("請輸入這一趟的金額");
    return;
  }

  getDay(date).trips.push(value);

  input.value = "";

  save();

}


/* 新增加油 */

function addGas(){

  const date =
    document.getElementById("dateInput").value;

  const input =
    document.getElementById("gasInput");

  const value =
    Number(input.value);

  if(value <= 0){
    alert("請輸入加油金額");
    return;
  }

  getDay(date).gas.push(value);

  input.value = "";

  save();

}


/* 新增系統費 */

function addSystem(){

  const date =
    document.getElementById("dateInput").value;

  const input =
    document.getElementById("systemInput");

  const value =
    Number(input.value);

  if(value <= 0){
    alert("請輸入系統費金額");
    return;
  }

  getDay(date).system.push(value);

  input.value = "";

  save();

}


/* 新增儲值費 */

function addTopup(){

  const date =
    document.getElementById("dateInput").value;

  const input =
    document.getElementById("topupInput");

  const value =
    Number(input.value);

  if(value <= 0){
    alert("請輸入儲值費金額");
    return;
  }

  getDay(date).topup.push(value);

  input.value = "";

  save();

}


/* 刪除收入 */

function deleteTrip(date,index){

  getDay(date).trips.splice(index,1);

  save();

}


/* 刪除支出 */

function deleteExpense(date,type,index){

  getDay(date)[type].splice(index,1);

  save();

}


/* 補登以前資料 */

function saveOld(){

  const date =
    document.getElementById("oldDate").value;

  if(!date){
    alert("請選擇日期");
    return;
  }

  const income =
    Number(
      document.getElementById("oldIncome").value
    ) || 0;

  const gas =
    Number(
      document.getElementById("oldGas").value
    ) || 0;

  const system =
    Number(
      document.getElementById("oldSystem").value
    ) || 0;

  const topup =
    Number(
      document.getElementById("oldTopup").value
    ) || 0;


  data[date] = {

    trips: income > 0 ? [income] : [],

    gas: gas > 0 ? [gas] : [],

    system: system > 0 ? [system] : [],

    topup: topup > 0 ? [topup] : [],

    old: true

  };


  document.getElementById("oldIncome").value = "";

  document.getElementById("oldGas").value = "";

  document.getElementById("oldSystem").value = "";

  document.getElementById("oldTopup").value = "";

  save();

}


/* 顯示支出列表 */

function showExpenseList(
  date,
  list,
  type,
  containerId,
  label
){

  const container =
    document.getElementById(containerId);

  if(!list.length){

    container.innerHTML =
      '<p class="small">' +
      '今天還沒有' +
      label +
      '</p>';

    return;

  }


  container.innerHTML =
    list.map(function(value,index){

      return `

      <div class="item">

        <span>
          第${index+1}次　${money(value)}
        </span>

        <button
          class="del"
          onclick="
            deleteExpense(
              '${date}',
              '${type}',
              ${index}
            )
          "
        >
          刪除
        </button>

      </div>

      `;

    }).join("");

}


/* 顯示畫面 */

function render(){

  const date =
    document.getElementById("dateInput").value;

  const day =
    getDay(date);


  /* 今日 */

  const income =
    total(day.trips);

  const gas =
    total(day.gas);

  const system =
    total(day.system);

  const topup =
    total(day.topup);

  const expense =
    gas + system + topup;

  const net =
    income - expense;


  document.getElementById(
    "todayIncome"
  ).textContent = money(income);


  document.getElementById(
    "todayExpense"
  ).textContent = money(expense);


  document.getElementById(
    "todayNet"
  ).textContent = money(net);


  document.getElementById(
    "todayTrips"
  ).textContent =
    day.trips.length + " 趟";


  /* 收入 */

  const tripList =
    document.getElementById("tripList");

  if(day.trips.length){

    tripList.innerHTML =
      day.trips.map(function(value,index){

        return `

        <div class="item">

          <span>
            第${index+1}趟　${money(value)}
          </span>

          <button
            class="del"
            onclick="
              deleteTrip(
                '${date}',
                ${index}
              )
            "
          >
            刪除
          </button>

        </div>

        `;

      }).join("");

  }else{

    tripList.innerHTML =
      '<p class="small">今天還沒有收入</p>';

  }


  /* 三種支出 */

  showExpenseList(
    date,
    day.gas,
    "gas",
    "gasList",
    "加油"
  );

  showExpenseList(
    date,
    day.system,
    "system",
    "systemList",
    "系統費"
  );

  showExpenseList(
    date,
    day.topup,
    "topup",
    "topupList",
    "儲值費"
  );


  /* 累計 */

  let allIncome = 0;

  let allGas = 0;

  let allSystem = 0;

  let allTopup = 0;


  Object.values(data).forEach(function(day){

    allIncome += total(day.trips);

    allGas += total(day.gas);

    allSystem += total(day.system);

    allTopup += total(day.topup);

  });


  const allExpense =
    allGas +
    allSystem +
    allTopup;

  const allNet =
    allIncome -
    allExpense;


  document.getElementById(
    "totalIncome"
  ).textContent = money(allIncome);


  document.getElementById(
    "totalGas"
  ).textContent = money(allGas);


  document.getElementById(
    "totalSystem"
  ).textContent = money(allSystem);


  document.getElementById(
    "totalTopup"
  ).textContent = money(allTopup);


  document.getElementById(
    "totalExpense"
  ).textContent = money(allExpense);


  document.getElementById(
    "totalNet"
  ).textContent = money(allNet);


  /* 每日紀錄 */

  const history =
    document.getElementById("historyList");

  const dates =
    Object.keys(data)
    .sort()
    .reverse();


  if(!dates.length){

    history.innerHTML =
      '<p class="small">還沒有紀錄</p>';

    return;

  }


  history.innerHTML =
    dates.map(function(date){

      const day =
        getDay(date);

      const income =
        total(day.trips);

      const gas =
        total(day.gas);

      const system =
        total(day.system);

      const topup =
        total(day.topup);

      const expense =
        gas + system + topup;

      const net =
        income - expense;


      return `

      <div class="item">

        <span>

          <b>${date}</b>

          <br>

          <small>

            收入 ${money(income)}

            <br>

            加油 ${money(gas)}

            ｜ 系統費 ${money(system)}

            ｜ 儲值費 ${money(topup)}

          </small>

        </span>

        <b>
          ${money(net)}
        </b>

      </div>

      `;

    }).join("");

}


/* 綁定按鈕 */

document
  .getElementById("tripButton")
  .addEventListener(
    "click",
    addTrip
  );


document
  .getElementById("gasButton")
  .addEventListener(
    "click",
    addGas
  );


document
  .getElementById("systemButton")
  .addEventListener(
    "click",
    addSystem
  );


document
  .getElementById("topupButton")
  .addEventListener(
    "click",
    addTopup
  );


document
  .getElementById("oldSaveButton")
  .addEventListener(
    "click",
    saveOld
  );


document
  .getElementById("dateInput")
  .addEventListener(
    "change",
    render
  );


/* 啟動 */

document.getElementById(
  "dateInput"
).value = getToday();


document.getElementById(
  "oldDate"
).value = getToday();


render();

</script>

</body>
</html>
